name: Deploy

on:
  push:
    branches: [main]
  # The activity feed is baked at build time, so the site only looks current if it
  # rebuilds on its own. Daily at 06:00 UTC.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# One deploy at a time; never cancel one mid-flight.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The gate. Nothing reaches Cloudflare that has not passed formatting, types, tests
  # and a clean build first — this workflow previously went straight from `npm ci` to a
  # deploy, so the only consequence of a type error was a red check after the fact.
  verify:
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # No checkout and no rebuild: the artifact *is* the verified output, so what ships
      # is bit-for-bit what the gate approved rather than a second build assumed to
      # match it.
      - name: Download verified site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=keefersery --branch=main

  # Keeps the committed API fallback from going stale.
  #
  # src/data/activity-cache.json is what the build falls back to when the GitHub API is
  # unreachable, but CI used to write it and then throw it away — so the committed copy
  # only refreshed when a local build happened to be committed by hand, and it aged out
  # of usefulness in between. Writing it back once a night fixes that.
  #
  # Loop-safe by construction: a push authenticated with the default GITHUB_TOKEN does
  # not trigger workflow runs, so this cannot retrigger Deploy.
  refresh-cache:
    needs: verify
    # Nightly only. On an ordinary push the deployed site is already current and the
    # fallback is at most one commit behind, which is not worth a commit per push.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download refreshed activity cache
        uses: actions/download-artifact@v8
        with:
          name: activity-cache
          path: src/data

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/activity-cache.json; then
            echo "Activity cache unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/activity-cache.json
          git commit -m "Refresh activity cache fallback"
          git push

  # Tells someone when this breaks.
  #
  # Deploy failed on the audit gate every night from Aug 4 to Aug 24 2026 and went on
  # doing so unnoticed, because a red cron on a repo nobody is watching is not a
  # notification — links.yml reached that conclusion first, for link rot, which is the
  # cheaper failure of the two. Three weeks of a frozen activity feed is what it cost to
  # not apply it here as well.
  #
  # `always()` rather than `failure()`: refresh-cache is skipped on ordinary pushes and
  # deploy is skipped when verify fails, so the interesting states are spread across
  # results this job has to inspect rather than infer.
  alarm:
    needs: [verify, deploy, refresh-cache]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/github-script@v9
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const failed = Object.entries(JSON.parse(process.env.NEEDS))
              .filter(([, job]) => job.result === 'failure')
              .map(([name]) => name);

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failed',
            });

            if (!failed.length) {
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Deploy succeeded again: ${process.env.RUN_URL}. Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
              return;
            }

            const body = [
              `Deploy failed at: **${failed.join(', ')}**.`,
              '',
              `Most recent run: ${process.env.RUN_URL}`,
              `Triggered by \`${context.eventName}\` on \`${context.sha.slice(0, 7)}\`.`,
              '',
              'The site is not being rebuilt while this is red, and it does not look',
              'stale when it happens — relative dates are resolved at build time, so the',
              'deployed page goes on reporting "last push today" indefinitely.',
              '',
              'A nightly failure with no code change is usually the `npm audit` gate:',
              'see the `overrides` note in CLAUDE.md before reaching for `--force`.',
            ].join('\n');

            // One issue, kept pointing at the most recent run. The failure this was
            // written for repeated 21 times; 21 identical issues would have been just as
            // easy to ignore as none.
            if (open.length) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Deploy is failing — keefersery.com is not being rebuilt',
                body,
                labels: ['deploy-failed'],
              });
            }

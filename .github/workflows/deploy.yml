name: Deploy

on:
  push:
    branches: [main]
  # The activity feed is baked at build time, so the site only looks current if it
  # rebuilds on its own. Daily at 06:00 UTC.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# One deploy at a time; never cancel one mid-flight.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Lifts the GitHub API rate limit from 60/hr to 5000/hr for the activity fetch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=keefersery --branch=main

name: Verify

# Called, never triggered directly. Both entry points — pr.yml for pull requests and
# deploy.yml for main/nightly — delegate here, so the checks guarding a PR and the
# checks guarding a deploy are the same job by construction and cannot drift.
on:
  workflow_call:

concurrency:
  # `github.workflow` is the *caller's* name, so a PR's verify and a deploy's verify
  # land in different groups and never cancel one another.
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # Superseding a PR push should cancel the stale run; superseding a deploy should not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Workflows are the one part of this repo with no local feedback loop: a bad
      # expression, a misspelled runner label or a wrong `needs` reference only shows up
      # when a run fails, and for the scheduled ones that can be a day later.
      #
      # The official image rather than a third-party wrapper action, pinned rather than
      # `latest`, and it bundles shellcheck so the `run:` blocks get linted too.
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - uses: actions/setup-node@v4
        with:
          # Reads .nvmrc, so CI and local development cannot disagree about Node.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Every dependency here is build-time — the deployed site is plain HTML with no
      # runtime dependencies at all — so a compromised package's payoff is injecting
      # something into the generated output. That makes the whole tree worth auditing,
      # not just `dependencies`.
      #
      # This is expected to stay at zero; see the `overrides` block in package.json. When
      # a new advisory lands, the fix is an override pinning the patched transitive
      # version. If one is genuinely unactionable, raise the level rather than deleting
      # the step, so the gate keeps meaning something.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Cheap, deterministic checks first. A formatting or type error should not wait on
      # a browser download, OG image rendering, and the GitHub API.
      - name: Formatting
        run: npm run format:check

      - name: Types and templates
        run: npm run check

      # Coverage thresholds are a ratchet, not a target. They sit just under the current
      # numbers so ordinary work does not trip them, while deleting a test does. The
      # global line figure is held down by src/lib/github.ts, most of which is network
      # I/O that the real build exercises far better than a mocked fetch would — raise
      # the floor when the pure surface grows, not by mocking that.
      - name: Unit tests and coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # Lifts the GitHub API rate limit from 60/hr to 5000/hr for the activity fetch.
          # Note src/lib/github.ts throws under CI rather than quietly dropping a pinned
          # project it could not fetch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Everything below needs the built site.

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # Proves the Content Security Policy does not block the site's own inline theme
      # scripts — a failure that is invisible to every check above it, because the build
      # succeeds and the HTML is correct either way.
      - name: Browser tests
        run: npm run test:e2e

      # Performance and accessibility budgets. Asserts, among other things, that the
      # site still ships zero bytes of JavaScript and makes zero third-party requests.
      - name: Lighthouse budgets
        run: npx lhci autorun

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-diagnostics
          path: |
            test-results/
            playwright-report/
            .lighthouseci/
          retention-days: 7
          if-no-files-found: ignore

      # Handing the built site to the caller means Deploy publishes the exact bytes that
      # passed above, rather than rebuilding and assuming the same output.
      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7
          if-no-files-found: error

      # The build refreshes the committed API fallback. deploy.yml's refresh-cache job
      # commits this back on the nightly run — see that workflow for why.
      - name: Upload refreshed activity cache
        uses: actions/upload-artifact@v4
        with:
          name: activity-cache
          path: src/data/activity-cache.json
          retention-days: 7
          if-no-files-found: error

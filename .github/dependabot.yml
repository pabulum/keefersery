version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # One PR per group rather than per package: this is a two-page static site, so a
    # batched bump that passes `verify` is the whole review.
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      dev:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"

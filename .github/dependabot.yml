version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # One PR per group rather than per package: this is a two-page static site, so a
    # batched bump that passes `verify` is the whole review.
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      dev:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # Astro pins this at an exact version and imports it internally; we declare it
      # only because astro.config.mjs imports it directly (see CLAUDE.md). Bumping it
      # independently installs a second, nested copy and the markdown pipeline splits
      # across two versions. It moves when astro moves.
      - dependency-name: "@astrojs/markdown-satteri"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
